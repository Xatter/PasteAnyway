<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Account Verification - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 48px;
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.2s;
            background: #f7fafc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.blocked {
            border-color: #fc8181;
            background: #fff5f5;
        }

        .warning {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fffaf0;
            border: 1px solid #fbd38d;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: #c05621;
        }

        .warning svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: #dd6b20;
        }

        .blocked-notice {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fed7d7;
            border: 1px solid #fc8181;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: #c53030;
        }

        .blocked-notice svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: #e53e3e;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(102, 126, 234, 0.5);
        }

        .security-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }

        .security-note svg {
            width: 14px;
            height: 14px;
            fill: #a0aec0;
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
            <h1>Verify Your Email</h1>
            <p class="subtitle">Please confirm your email address to continue</p>
        </div>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" value="user@example.com" readonly style="background: #edf2f7; color: #718096;">
            </div>

            <div class="form-group">
                <label for="confirm-email">Confirm Email Address</label>
                <input type="email" id="confirm-email" class="blocked" placeholder="Please type your email again">
                <div class="blocked-notice">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span><strong>Paste is disabled</strong> for security. Please type manually.</span>
                </div>
            </div>

            <button type="submit">Verify Email</button>

            <p class="security-note">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                Secure 256-bit SSL encryption
            </p>
        </form>
    </div>

    <script>
        // Block paste on the confirm email field
        const confirmEmail = document.getElementById('confirm-email');

        confirmEmail.addEventListener('paste', function(e) {
            e.preventDefault();
            // Show a brief flash to indicate paste was blocked
            this.style.animation = 'shake 0.5s';
            setTimeout(() => this.style.animation = '', 500);
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
